[project]
name = "coffeehouse"
version = "0.1.0"
description = ""
authors = [
    { name = "pawelrus91", email = "18408679+pawelrus91@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "django (==6.1.2)",
    "django-environ (>=0.14.0,<0.15.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pytest-django[django] (>=4.14.0,<5.0.0)",
]


[dependency-groups]
dev = ["django-stubs (==6.1.2)", "ruff (>=0.17.2,<0.18.0)"]


[tool.poetry]
package-mode = false


[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings.test"


[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
output-prefer-rule-codes = true
target-version = "py313" # As same as docker image Python version
line-length = 92
extend-exclude = [
    # Internal project:
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
]


[tool.ruff.format]
quote-style = "single"


[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "DJ",   # flake8-django 
    "E",    # pycodestyle
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simpify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "A005",    # allow to shadow stdlib and builtin module names
    "ISC001",  # implicit string concat conflicts with `ruff format`
    "ISC003",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "PLR2004", # do not report magic numbers
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "PTH118",
    "TRY003",  # long exception messages from `tryceratops`
    "RUF105",  # we prefer `# noqa`, over `# ruff` comments
    "RUF106",  #
    "RUF201",  #
]
external = ["WPS"]

# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # asserts
]


[tool.mypy]
plugins = ["mypy_django_plugin.main"]


[tool.django-stubs]
django_settings_module = "config.settings"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
