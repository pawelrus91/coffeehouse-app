services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 5
  server:
    build: .
    volumes:
      - .:/app/.
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      
volumes:
  postgres_data:
